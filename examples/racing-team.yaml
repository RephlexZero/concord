# Example: the Discord server of a Formula Student team.
#
# Keys (`key:`, category names under `categories:`) are permanent identities.
# Change `name:` to rename something; keep the key.
#
# Mode is `partial` (the default): anything not written here (role
# permissions, topics, slowmode, ...) is left as it is on Discord. Set
# `concord: { mode: authoritative }` to make this file the whole truth.

guild_id: "1000000000004232083"

# Server settings. Each one is optional; anything left out stays as it is.
server:
  description: Home of the Example Racing Formula Student team.
  verification_level: medium
  default_notifications: mentions
  content_filter: everyone
  locale: en-GB
  system_channel: general-chat # channel keys, as everywhere else
  system_messages: { join: true, join_replies: false, setup_tips: false }
  rules_channel: rules
  updates_channel: moderator-only
  safety_alerts_channel: moderator-only
  afk_channel: voice-general
  afk_timeout: 15m
  widget: { enabled: true, channel: introductions }

roles: # highest first
  - { key: director, name: Director, color: "#f1c40f", hoist: true }
  - { key: mod,      name: Mod,      color: "#3498db", hoist: true }
  - { key: lead,     name: Lead,     color: "#e91e63", hoist: true }

tag_sets:
  base: [Question, Issue, Testing, How-to, Ordering, Open, In Progress, Blocked, Resolved]
  subteams:
    [Mech Inboard, Mech Outboard, Powertrain, Elec, Systems, Controls, Aero, VD, Driverless, Trackside]

templates:
  # One per subteam: a chat channel and a forum for questions/issues.
  subteam:
    channels:
      - { key: main, type: text, name: "{slug}-main" }
      - key: forum
        type: forum
        name: "{slug}-forum"
        tags: [base, "{subsystems}"]
        require_tag: true
        layout: list
        sort: activity
        guidelines: "What / why / deadline / who you need"
    # Each subteam adds itself to the onboarding prompt below.
    onboarding_option:
      prompt: subteams
      title: "{slug}"
      channels: ["{key}"] # the category: members see all of its channels

# Uncategorised channels (Discord always shows these above all categories).
channels:
  - key: rules
    type: text
    name: rules
    overrides: { "@everyone": { deny: [SEND_MESSAGES] } }
  - key: announcements
    type: announcement
    name: announcements
    overrides:
      "@everyone": { deny: [SEND_MESSAGES] }
      Lead: { allow: [SEND_MESSAGES] }
      Director: { allow: [SEND_MESSAGES] }
  - key: wiki
    type: forum
    name: wiki
    tags: [Guide, Process, Reference, Onboarding]
    guidelines: "One post per topic. Keep the first message up to date."
    overrides:
      "@everyone": { deny: [CREATE_POSTS] }
      Lead: { allow: [CREATE_POSTS] }
      Director: { allow: [CREATE_POSTS] }
  - { key: introductions, type: text, name: introductions }
  - { key: moderator-only, type: text, name: moderator-only, private: [Director, Mod] }

categories:
  general:
    name: general
    channels:
      - { key: general-chat, type: text, name: general }

  directors:
    name: directors
    private: [Director]
    channels:
      - { key: directors-chat, type: text, name: directors-chat }
      - { key: directors-voice, type: voice, name: Directors }

  leads:
    name: leads
    private: [Lead, Director]
    channels:
      - { key: leads-chat, type: text, name: leads-chat }
      - { key: leads-voice, type: voice, name: Leads }

  engineering:
    name: "engineering 🏁"
    channels:
      - { key: engineering-main, type: text, name: engineering-main }
      - key: interfaces
        type: forum
        name: interfaces
        guidelines: "One post per subteam boundary. Title it `A ↔ B`. Leads create posts; everyone replies."
        tags: [subteams, { name: Agreed, moderated: true }, Under Change]
        overrides:
          "@everyone": { deny: [CREATE_POSTS] }
          # MANAGE_POSTS lets leads apply the moderated `Agreed` tag.
          Lead: { allow: [CREATE_POSTS, MANAGE_POSTS] }
      - key: design-reviews
        type: forum
        name: design-reviews
        require_tag: true
        guidelines: |
          What is being reviewed, and the requirements it must meet.
          Evidence (calcs, sims, test data) and CAD/drawing links.
          Interfaces affected, reviewers wanted, and the deadline.
        tags:
          - Concept
          - Detailed
          - Pre-manufacture
          - subteams
          - { name: Approved, moderated: true }
          - { name: Changes Requested, moderated: true }
        overrides:
          Lead: { allow: [MANAGE_POSTS] }

  mech-inboard:
    template: subteam
    name: "mech-inboard 🔩"
    vars: { slug: mech-inboard, subsystems: [Chassis, Pedal Box, Steering, Seat, Firewall] }
  mech-outboard:
    template: subteam
    name: "mech-outboard 🛞"
    vars: { slug: mech-outboard, subsystems: [Uprights, Hubs, Wishbones, Brakes, Wheels] }
  powertrain:
    template: subteam
    name: "powertrain ⚙️"
    vars: { slug: powertrain, subsystems: [Motor, Inverter, Gearbox, Cooling, Driveshafts] }
  elec:
    template: subteam
    name: "elec ⚡"
    vars: { slug: elec, subsystems: [Accumulator, BMS, LV Harness, HV Harness, PCBs] }
  systems:
    template: subteam
    name: "systems 🧩"
    vars: { slug: systems, subsystems: [Requirements, Integration, Validation, Docs] }
  controls:
    template: subteam
    name: "controls 🎛️"
    vars: { slug: controls, subsystems: [VCU, Torque Vectoring, Telemetry, Firmware] }
  aero:
    template: subteam
    name: "aero 🌬️"
    vars: { slug: aero, subsystems: [Front Wing, Rear Wing, Undertray, CFD, Wind Tunnel] }
  vd:
    template: subteam
    name: "vehicle-dynamics 🪄"
    vars: { slug: vd, subsystems: [Kinematics, Tyres, Sim, Setup] }
  driverless:
    template: subteam
    name: "driverless 🤖"
    vars: { slug: driverless, subsystems: [Perception, SLAM, Planning, Control, Sim] }
  trackside:
    template: subteam
    name: "trackside 🏎️"
    vars: { slug: trackside, subsystems: [Logistics, Spares, Setup Sheets, Data, Safety] }

  voice:
    name: voice
    channels:
      - { key: voice-general, type: voice, name: General }
      - { key: voice-meeting-1, type: voice, name: Meeting Room 1 }
      - { key: voice-meeting-2, type: voice, name: Meeting Room 2 }

# -- Server-wide sections. Each is managed as a whole when present and left
# alone when absent. Channels are referred to by key, roles by name.

onboarding:
  # Everyone sees these; Discord wants at least 7 (a category counts its channels).
  default_channels: [rules, announcements, introductions, general, engineering]
  prompts:
    - key: why
      title: What brings you here?
      single: true
      required: true
      options:
        - { title: "I'm on the team", emoji: "🏎️", channels: [engineering] }
        - title: Alumni
          description: Former team members
          emoji: "id:1000000000004236301" # a custom emoji, by ID
          roles: [Alumni]
    - key: subteams
      title: Which subteams are you in?
      type: dropdown
      # Options come from the `subteam` template.

welcome_screen:
  description: The Formula Student team server.
  channels:
    - { channel: rules, description: Read the rules, emoji: "📜" }
    - { channel: announcements, description: Team news, emoji: "📣" }
    - { channel: wiki, description: How we do things, emoji: "📚" }

guide: # the Server Guide
  welcome:
    message: "Welcome to Example Racing, [@username]! Start with the to-dos below."
    authors: ["1000000000004232090"]
  actions: # to-dos: `view` the channel (default) or `chat` in it
    - { title: Read the rules, channel: rules, emoji: "📜", description: "The short version: be kind." }
    - { title: Introduce yourself, channel: introductions, type: chat, emoji: "👋", description: "Who are you, what do you study?" }
    - { title: Say hello, channel: general-chat, type: chat, emoji: "id:1000000000004236301" }
  resources:
    - { title: Interfaces, channel: interfaces, emoji: "🔗", description: Where subteams agree on boundaries }
    - { title: Wiki, channel: wiki, emoji: "📚", description: Guides and processes }

join_questions: # the form applicants fill in
  description: Tell us a bit about yourself.
  rules:
    - Be respectful
    - No spam
    - Keep CAD and sponsor details inside the server
  questions:
    - { label: "What's your name?", placeholder: First and last name }
    - { label: Which year are you in?, type: choice, choices: [1st, 2nd, 3rd, 4th+] }
    - { label: Why do you want to join?, type: paragraph, required: false }

automod:
  - key: mention-spam
    name: Too many mentions
    trigger: mention_spam
    mention_limit: 8
    raid_protection: true
    actions: [{ block: true }, { timeout: 10m }]
    exempt_roles: [Director]
  - key: slurs
    name: Block slurs
    trigger: keyword_preset
    presets: [slurs, profanity]
    actions: [{ block: "Please keep it civil." }]
  - key: banned-words
    name: Banned words
    trigger: keyword
    keywords: ["*scam*", "free nitro", "discord.gg/*"]
    allow: [scampi]
    actions: [{ block: true }, { alert: moderator-only }]
    exempt_channels: [moderator-only]
  - key: spam
    name: Suspected spam
    trigger: spam
    actions: [{ block: true }]
  - key: profiles
    name: Profile names
    trigger: member_profile
    keywords: ["*nitro*"]
    actions: [{ block_interactions: true }, { alert: moderator-only }]

emoji:
  - { key: logo, name: fs_logo } # already on the server: managed by name
  - { key: chequered, name: chequered_flag, file: assets/chequered.png }

stickers:
  - { key: box-box, name: Box Box, description: Pit now, emoji: "🛞" }

sounds:
  - { key: engine-rev, name: Engine Rev, volume: 0.6, emoji: "🏎️" }
