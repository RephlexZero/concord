# cargo-deny: run `cargo deny check` (CI runs it on every push).

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory: vulnerabilities, unsound code, yanked crates
# and unmaintained crates.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Mozilla's root certificates (webpki-root-certs), a permissive data licence.
    "CDLA-Permissive-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
